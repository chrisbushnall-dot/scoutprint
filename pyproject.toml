[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-scout"
version = "0.1.0"
description = "Self-hosted, provenance-first football player-season similarity research"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.116,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "POT>=0.9.5,<1",
  "polars>=1.25,<2",
  "pyarrow>=19,<22",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "streamlit>=1.43,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["app", "database", "identity", "ingestion", "providers", "scripts", "similarity", "visualisation", "vps_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
